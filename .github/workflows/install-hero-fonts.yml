name: Install hero fonts

on:
  push:
    paths:
      - ".github/workflows/install-hero-fonts.yml"

permissions:
  contents: write

jobs:
  install-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download free font sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/fonts

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/Jorgelino328/overclocked/c3e96d93e3d67478a12ed56d8152a6cba562bf01/assets/fonts/public_domain/opentype_fonts/Droid%201997.otf" \
            -o /tmp/Droid-1997.otf

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/marckscript/MarckScript-Regular.ttf" \
            -o /tmp/MarckScript-Regular.ttf

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/marckscript/OFL.txt" \
            -o app/fonts/OFL-Marck-Script.txt

          cat > app/fonts/LICENSE-Droid-1997.txt <<'EOF'
          Droid 1997 Regular
          Designer: Ray Larabie / Typodermic Fonts
          Cyrillic: Sergiy S. Tkachenko
          License: Creative Commons Zero v1.0 Universal (CC0 1.0), no rights reserved.
          License URL: https://creativecommons.org/publicdomain/zero/1.0/
          Upstream listing: https://www.dafont.com/droid.font

          The upstream author states that the fonts in the Droid archive are released
          under CC0 and may be used without requesting permission.
          EOF

      - name: Convert fonts to WOFF2
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet fonttools brotli
          python - <<'PY'
          from fontTools.ttLib import TTFont

          pairs = [
              ("/tmp/Droid-1997.otf", "app/fonts/Droid-1997-Regular.woff2"),
              ("/tmp/MarckScript-Regular.ttf", "app/fonts/MarckScript-Regular.woff2"),
          ]
          for src, dst in pairs:
              font = TTFont(src)
              font.flavor = "woff2"
              font.save(dst)
          PY

      - name: Wire fonts into the hero
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          layout_path = Path("app/layout.tsx")
          layout = layout_path.read_text(encoding="utf-8")

          font_block = '''\n/* HERO FASHION — Droid 1997 Regular (CC0). */\nconst droid1997 = localFont({\n  src: "./fonts/Droid-1997-Regular.woff2",\n  variable: "--ff-droid-1997",\n  weight: "400",\n  style: "normal",\n  display: "swap",\n  fallback: ["Arial Narrow", "Arial", "sans-serif"],\n});\n\n/* HERO SCRIPT — Marck Script Regular (SIL OFL). */\nconst marckScript = localFont({\n  src: "./fonts/MarckScript-Regular.woff2",\n  variable: "--ff-marck-script",\n  weight: "400",\n  style: "normal",\n  display: "swap",\n  fallback: ["cursive"],\n});\n'''

          if "const droid1997 = localFont" not in layout:
              marker = '''const playfairItalic = localFont({\n  src: "./fonts/PlayfairDisplay-Italic-Cyrillic.ttf",\n  variable: "--ff-playfair-italic",\n  weight: "400",\n  style: "italic",\n  display: "swap",\n  fallback: ["Georgia", "serif"],\n});\n'''
              if marker not in layout:
                  raise SystemExit("Could not locate playfairItalic block in app/layout.tsx")
              layout = layout.replace(marker, marker + font_block, 1)

          old_class = 'className={`${tenor.variable} ${onest.variable} ${playfair.variable} ${playfairItalic.variable}`}'
          new_class = 'className={`${tenor.variable} ${onest.variable} ${playfair.variable} ${playfairItalic.variable} ${droid1997.variable} ${marckScript.variable}`}'
          if old_class in layout:
              layout = layout.replace(old_class, new_class, 1)
          elif new_class not in layout:
              raise SystemExit("Could not locate <html> font className in app/layout.tsx")

          layout_path.write_text(layout, encoding="utf-8")

          css_path = Path("app/globals.css")
          css = css_path.read_text(encoding="utf-8")

          token_marker = '  --font-display: var(--ff-tenor), Georgia, serif;\n'
          hero_tokens = (
              '  --font-hero-anchor: var(--ff-droid-1997), "Arial Narrow", Arial, sans-serif;\n'
              '  --font-hero-script: var(--ff-marck-script), cursive;\n'
          )
          if "--font-hero-anchor:" not in css:
              if token_marker not in css:
                  raise SystemExit("Could not locate typography tokens in app/globals.css")
              css = css.replace(token_marker, token_marker + hero_tokens, 1)

          old_anchor = '''/* The bold anchor line — Tenor Sans in place of Droid 1997 Regular\n   (not self-hosted here, and this project only ships two subset\n   faces; see design-tokens skill). */\n.hero-statement-anchor {\n  display: block;\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(0.85rem, 4.7vw, 2.7rem);\n  line-height: 0.94;\n  letter-spacing: 0.02em;\n  text-transform: uppercase;\n  color: var(--paper);\n  white-space: nowrap;\n}\n'''
          new_anchor = '''/* Fashion anchor: exact Droid 1997 Regular. */\n.hero-statement-anchor {\n  display: block;\n  font-family: var(--font-hero-anchor);\n  font-weight: 400;\n  font-size: clamp(1rem, 5.4vw, 3rem);\n  line-height: 0.92;\n  letter-spacing: 0.035em;\n  text-transform: uppercase;\n  color: var(--paper);\n  white-space: nowrap;\n}\n'''
          if old_anchor in css:
              css = css.replace(old_anchor, new_anchor, 1)
          elif "font-family: var(--font-hero-anchor);" not in css:
              raise SystemExit("Could not locate hero anchor block in app/globals.css")

          old_script = '''/* The script line — Playfair Display Italic in place of Pushkin/\n   PushkinC (same substitution already used for every other\n   handwritten accent on this page). It rides up and left to cross\n   the anchor line's baseline, the way "пара" crosses the word above\n   it in the reference. */\n.hero-statement-script {\n  display: block;\n  margin-block-start: -0.62em;\n  margin-inline-start: clamp(1.75rem, 9vw, 3.5rem);\n  font-family: var(--ff-playfair-italic);\n  font-style: italic;\n  font-weight: 400;\n  font-size: clamp(0.78rem, 4.6vw, 1.55rem);\n  line-height: 1;\n  color: var(--red-bright);\n  white-space: nowrap;\n  transform: rotate(-3deg);\n  transform-origin: 0 100%;\n}\n'''
          new_script = '''/* Handwritten accent: exact Marck Script Regular.\n   It overlaps the anchor lightly, but stays readable as a separate line. */\n.hero-statement-script {\n  display: block;\n  margin-block-start: -0.48em;\n  margin-inline-start: clamp(2.25rem, 12vw, 4.25rem);\n  font-family: var(--font-hero-script);\n  font-style: normal;\n  font-weight: 400;\n  font-size: clamp(1.1rem, 6.3vw, 2.2rem);\n  line-height: 0.95;\n  color: var(--red-bright);\n  white-space: nowrap;\n  transform: rotate(-2deg);\n  transform-origin: 0 100%;\n}\n'''
          if old_script in css:
              css = css.replace(old_script, new_script, 1)
          elif "font-family: var(--font-hero-script);" not in css:
              raise SystemExit("Could not locate hero script block in app/globals.css")

          css = css.replace(
              'font-size: clamp(1.8rem, 3.15vw, 3.1rem);',
              'font-size: clamp(2.3rem, 3.6vw, 3.9rem);',
              1,
          )
          css = css.replace(
              'margin-inline-start: clamp(4rem, 10vw, 8rem);\n    font-size: clamp(1.6rem, 3vw, 3rem);',
              'margin-inline-start: clamp(5.5rem, 12vw, 10rem);\n    font-size: clamp(2.2rem, 3.35vw, 3.5rem);',
              1,
          )
          css = css.replace(
              '  .hero-statement-script {\n    font-size: 3rem;\n  }',
              '  .hero-statement-script {\n    font-size: 3.5rem;\n  }',
              1,
          )

          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Commit installed fonts and typography
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/fonts app/layout.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Install Droid 1997 and Marck Script hero fonts"
          git push origin HEAD:main
