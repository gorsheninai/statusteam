name: Deploy to Sprinthost

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Проверить сборку и FTPS без загрузки файлов"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sprinthost-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Check media
        run: npm run verify:media

      - name: Upload website over verified FTPS
        env:
          FTP_HOST: ${{ secrets.SPRINTHOST_FTP_HOST }}
          FTP_USER: ${{ secrets.SPRINTHOST_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SPRINTHOST_FTP_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: python
        run: |
          import ftplib
          import os
          import ssl
          from pathlib import Path

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          password = os.environ.get("FTP_PASSWORD", "")
          if not all((host, user, password)):
              raise SystemExit("Missing SPRINTHOST_FTP_HOST, SPRINTHOST_FTP_USER or SPRINTHOST_FTP_PASSWORD.")
          if host != "141.8.192.192" or user != "statusez@a1325854":
              raise SystemExit("Unexpected deployment account or server; no files uploaded.")
          root = Path("out")
          if not (root / "index.html").is_file():
              raise SystemExit("Missing out/index.html; no files uploaded.")

          # The extra FTP account is restricted to domains/statusteam-official.ru.
          target = "/public_html"
          tls_name = "myndarr.sprinthost.ru"
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=45)
          ftp.connect(host, 21)
          # Connect to the account IP but verify the hosting server certificate.
          ftp.host = tls_name
          try:
              ftp.auth()
          except ssl.SSLCertVerificationError:
              raise SystemExit("FTPS certificate verification failed for myndarr.sprinthost.ru. No credentials sent; confirm the FTPS hostname with hosting support.")
          ftp.login(user, password)
          ftp.prot_p()
          ftp.set_pasv(True)
          ftp.cwd(target)
          print("Verified FTPS login and /public_html destination.")

          if os.environ.get("DRY_RUN") == "true":
              print("Dry run successful; no files uploaded.")
              ftp.quit()
              raise SystemExit(0)

          protected = {".htaccess", "index.php", "api", "cgi-bin", ".well-known"}
          files = [
              p for p in root.rglob("*")
              if p.is_file() and not any(part in protected for part in p.relative_to(root).parts)
          ]
          # Upload assets before HTML so pages reference available assets.
          files.sort(key=lambda p: (p.suffix in {".html", ".txt"}, p.as_posix()))
          directories = {target}

          def ensure_directory(path):
              current = target
              for part in path.parts:
                  current += "/" + part
                  if current in directories:
                      continue
                  try:
                      ftp.mkd(current)
                  except ftplib.error_perm:
                      ftp.cwd(current)
                  directories.add(current)

          for path in files:
              relative = path.relative_to(root)
              ensure_directory(relative.parent)
              destination = target + "/" + relative.as_posix()
              temporary = destination + ".deploy-tmp"
              with path.open("rb") as stream:
                  ftp.storbinary("STOR " + temporary, stream, blocksize=65536)
              ftp.rename(temporary, destination)
          ftp.quit()
          print(f"Uploaded {len(files)} files. Existing server-only files were preserved.")

      - name: Check public HTTPS
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: curl --fail --silent --show-error --retry 3 --output /dev/null https://statusteam-official.ru/
