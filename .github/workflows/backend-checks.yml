name: PHP backend checks
on:
  push:
    branches: ['feat/sprinthost-ticket-backend']
  pull_request:
    paths: ['backend/**', 'src/features/forms/**', 'package*.json']
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-ci
          MYSQL_DATABASE: statusteam_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pfixture-only-ci" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, mbstring, sodium, simplexml
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --working-dir=backend
      - run: composer audit --working-dir=backend
      - run: find backend -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - run: php backend/tests/run.php
        env:
          TEST_ALLOW_RESET: 'yes'
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=statusteam_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: fixture-only-ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run backend:assets
      - run: npx playwright install --with-deps chromium
      - name: Mobile controller and HTTP access checks
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=statusteam_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: fixture-only-ci
          HTTP_FIXTURE_CONFIG: ${{ runner.temp }}/status-config.php
          HTTP_FIXTURE_JSON: ${{ runner.temp }}/status-fixture.json
        run: |
          php backend/tests/http-fixture.php
          mkdir -p "$RUNNER_TEMP/status-domain/public_html/api"
          cp backend/public/* "$RUNNER_TEMP/status-domain/public_html/api/"
          ln -s "$GITHUB_WORKSPACE/backend" "$RUNNER_TEMP/status-domain/status-backend"
          STATUS_CONFIG="$HTTP_FIXTURE_CONFIG" php -S localhost:34311 -t "$RUNNER_TEMP/status-domain/public_html" > "$RUNNER_TEMP/status-http.log" 2>&1 &
          HTTP_CHECK_PID=$!
          trap 'kill "$HTTP_CHECK_PID" 2>/dev/null || true' EXIT
          node backend/tests/http.mjs
  test-purchase:
    if: github.head_ref == 'codex/yookassa-test-checkout'
    runs-on: ubuntu-24.04
    env:
      STATUS_TEST_PURCHASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Package isolated checkout
        run: |
          test -s out/test-purchase/index.html
          grep -Fq 'Оформление билета' out/test-purchase/index.html
          grep -Fq '/api-test/purchase-assets/_next/' out/test-purchase/index.html
          mkdir stage
          cp out/test-purchase/index.html stage/test-purchase.html
          mkdir stage/_next
          cp -R out/_next/static stage/_next/
          cp backend/public/index.php stage/router.php
          cp backend/public/page.php backend/public/app.js stage/
          cp backend/scripts/install-test-purchase.sh stage/
          tar -czf test-purchase.tar.gz -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: statusteam-test-purchase
          path: test-purchase.tar.gz
          retention-days: 14
  control-purchase:
    if: github.head_ref == 'codex/yookassa-live-control'
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_FORM_ENDPOINT: /api/index.php?r=forms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the control form submits to the private endpoint
        run: |
          python3 -m http.server 4311 --directory out >/tmp/checkout-http.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            let sent;
            await page.route('**/api/index.php?*', async route => {
              const name = new URL(route.request().url()).searchParams.get('r');
              const docs = ['terms','buyers','privacy'].map(id => ({id, version:'fixture'}));
              if (name === 'control-order') sent = route.request().postDataJSON();
              await route.fulfill({json: name === 'session' ? {csrf:'fixture'} :
                name === 'control-documents' ? {amountKopecks:100, documents:docs} : {confirmationUrl:'https://yookassa.ru/checkout/fixture'}});
            });
            await page.route('https://yookassa.ru/checkout/fixture', route => route.fulfill({body:'YooKassa fixture'}));
            await page.goto('http://localhost:4311/');
            const pay = page.getByRole('button', {name:'Оплатить', exact:true});
            if (!await pay.isDisabled()) throw Error('Public checkout must stay closed');
            await page.goto('http://localhost:4311/?control=1#tickets');
            await page.getByText('Контрольная оплата · реальное списание 1 ₽').waitFor();
            await page.locator('#purchase-name').fill('Тест Покупатель');
            await page.locator('#purchase-email').fill('test@example.invalid');
            await page.locator('#purchase-phone').fill('+79990000000');
            await page.locator('#purchase-terms').check();
            if (!/^1\s*₽$/.test(await page.locator('.ticket-total output').innerText())) throw Error('Expected one ruble');
            await page.getByRole('button', {name:'Оплатить', exact:true}).click();
            await page.waitForURL('https://yookassa.ru/checkout/fixture');
            if (!sent || sent.csrf !== 'fixture' || sent.paymentMethod !== 'bank_card' ||
                !/^[a-f0-9]{64}$/.test(sent.requestKey) || sent.consentDocuments.length !== 3) throw Error('Unexpected request');
          } finally { await browser.close(); }
          JS
      - name: Package the protected checkout
        run: |
          mkdir -p stage/_next stage/src stage/public
          cp out/index.html stage/
          if [ -f out/index.txt ]; then cp out/index.txt stage/; fi
          cp -R out/_next/static stage/_next/
          cp backend/src/{App.php,Http.php,Mailer.php,TicketPdf.php,TicketDetails.php,TicketFont.json,TicketFont-LICENSE.txt} stage/src/
          cp backend/public/{index.php,page.php,app.css,app.js} stage/public/
          cp backend/scripts/install-live-control.sh stage/
          bash -n stage/install-live-control.sh
          tar -czf control-purchase.tar.gz -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: control-purchase
          path: control-purchase.tar.gz
